name: RetailAI Data Quality Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Generate cleaned dataset and quality report
        run: python src/retail_etl.py

      - name: Run data quality tests
        run: python -m pytest src/test_retail_quality.py -v