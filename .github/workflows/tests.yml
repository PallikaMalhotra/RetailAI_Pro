name: RetailAI Data Quality Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Download UCI Online Retail dataset
        run: |
          mkdir -p data/raw
          curl -fL "https://archive.ics.uci.edu/static/public/352/online+retail.zip" -o /tmp/online-retail.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/online-retail.zip'); print(z.namelist()); z.extractall('data/raw')"
          python -c "from pathlib import Path; p=list(Path('data/raw').rglob('*.xlsx')); print('Excel files:', p); assert p, 'No Excel file extracted'"

      - name: Generate cleaned dataset and quality report
        run: python src/retail_etl.py

      - name: Run data quality tests
        run: python -m pytest src/test_retail_quality.py -v

      - name: Load SQLite database
        run: python src/load_retail_database.py

      - name: Build star schema
        run: python src/build_star_schema.py

      - name: Run star schema tests
        run: python -m pytest src/test_star_schema.py -v